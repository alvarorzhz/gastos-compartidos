<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f3ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11150f" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <title>Gastos compartidos</title>
    <!-- Pantalla de carga: va aquí para verse al instante, antes de que llegue el resto de la app.
         La app la quita con un fundido cuando ya tiene algo que enseñar (src/lib/splash.ts). -->
    <style>
      :root { --splash-bg: #f5f3ed; --splash-text: #1f2a22; --splash-text-2: #5f685d; --splash-track: rgb(63 111 78 / 0.14); --splash-fill: #3f6f4e; --splash-glow: rgb(63 111 78 / 0.28); }
      @media (prefers-color-scheme: dark) {
        :root { --splash-bg: #11150f; --splash-text: #eef2ea; --splash-text-2: #a8b2a3; --splash-track: rgb(134 192 152 / 0.16); --splash-fill: #86c098; --splash-glow: rgb(134 192 152 / 0.3); }
      }
      html, body { margin: 0; background: var(--splash-bg); }
      .splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: radial-gradient(120% 70% at 50% 42%, var(--splash-track), transparent 60%), var(--splash-bg);
        color: var(--splash-text); text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        transition: opacity 320ms ease, transform 320ms ease;
      }
      #splash { z-index: 1001; }
      .splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .splash-logo { position: relative; width: 112px; height: 112px; animation: splash-pop 650ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
      .splash-logo::before {
        content: ''; position: absolute; inset: 0; border-radius: 30px; background: var(--splash-glow);
        animation: splash-glow 2.2s ease-out 700ms infinite;
      }
      .splash-logo svg { position: relative; display: block; width: 100%; height: 100%; filter: drop-shadow(0 12px 22px rgb(63 111 78 / 0.32)); }
      .splash-ring-a { animation: splash-in-a 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 150ms both, splash-breathe-a 2.2s ease-in-out 900ms infinite; }
      .splash-ring-b { animation: splash-in-b 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 150ms both, splash-breathe-b 2.2s ease-in-out 900ms infinite; }
      .splash-euro { transform-origin: 60px 60px; animation: splash-euro 450ms cubic-bezier(0.2, 0.9, 0.3, 1.4) 550ms both; }
      .splash-name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; animation: splash-up 500ms ease 250ms both; }
      .splash-tagline { margin-top: -14px; font-size: 15px; color: var(--splash-text-2); animation: splash-up 500ms ease 380ms both; }
      .splash-bar { position: relative; width: 132px; height: 4px; border-radius: 4px; overflow: hidden; background: var(--splash-track); animation: splash-up 500ms ease 500ms both; }
      .splash-bar::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 4px; background: var(--splash-fill);
        animation: splash-slide 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      /* Si tarda mucho (mala conexión), se explica en vez de dejar solo la animación. */
      .splash-slow { position: absolute; left: 24px; right: 24px; bottom: calc(env(safe-area-inset-bottom) + 40px); font-size: 14px; color: var(--splash-text-2); opacity: 0; animation: splash-up 400ms ease 8s forwards; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(0.6); } }
      @keyframes splash-glow { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.45); opacity: 0; } }
      @keyframes splash-in-a { from { opacity: 0; transform: translateX(-14px); } }
      @keyframes splash-in-b { from { opacity: 0; transform: translateX(14px); } }
      @keyframes splash-breathe-a { 50% { transform: translateX(2px); } }
      @keyframes splash-breathe-b { 50% { transform: translateX(-2px); } }
      @keyframes splash-euro { from { opacity: 0; transform: scale(0.3); } }
      @keyframes splash-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .splash *, .splash *::before, .splash *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
        .splash-slow { animation-delay: 8s !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-label="Cargando Gastos compartidos">
      <div class="splash-logo" aria-hidden="true">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-tile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5a8d69" />
              <stop offset="1" stop-color="#335c40" />
            </linearGradient>
          </defs>
          <rect width="120" height="120" rx="30" fill="url(#splash-tile)" />
          <g fill="none" stroke="#fff" stroke-width="6.6" stroke-linecap="round">
            <circle class="splash-ring-a" cx="47.5" cy="60" r="22.5" />
            <circle class="splash-ring-b" cx="72.5" cy="60" r="22.5" />
          </g>
          <text class="splash-euro" x="60" y="67.6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">€</text>
        </svg>
      </div>
      <div class="splash-name">Gastos compartidos</div>
      <div class="splash-tagline">Vuestras cuentas, claras</div>
      <div class="splash-bar" aria-hidden="true"></div>
      <div class="splash-slow">Está tardando más de lo normal. Revisa la conexión.</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
